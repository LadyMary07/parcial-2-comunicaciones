networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  postgres_data:
  joomla_assets:
  shared_logs:
  grafana_data:

services:
  database:
    image: postgres:16-alpine
    container_name: parcial_database
    networks:
      - backend_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  joomla:
    build: ./joomla
    container_name: parcial_joomla
    networks:
      - frontend_net
      - backend_net
    volumes:
      - joomla_assets:/var/www/html
      - shared_logs:/var/log/apache2
    environment:
      - JOOMLA_DB_HOST=database
      - JOOMLA_DB_USER=${POSTGRES_USER}
      - JOOMLA_DB_PASSWORD=${POSTGRES_PASSWORD}
      - JOOMLA_DB_NAME=${POSTGRES_DB}
      - JOOMLA_DB_TYPE=pgsql
      - JOOMLA_SITE_NAME=${JOOMLA_SITE_NAME}
      - JOOMLA_ADMIN_USER=${JOOMLA_ADMIN_USER}
      - JOOMLA_ADMIN_USERNAME=${JOOMLA_ADMIN_USERNAME}
      - JOOMLA_ADMIN_PASSWORD=${JOOMLA_ADMIN_PASSWORD}
      - JOOMLA_ADMIN_EMAIL=${JOOMLA_ADMIN_EMAIL}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  jupyter:
    image: jupyter/base-notebook
    container_name: parcial_jupyter
    networks:
      - frontend_net
    command: ["start-notebook.py", "--ServerApp.base_url=/jupyter"]
    volumes:
      - ./jupyter/notebooks:/home/jovyan/work
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: parcial_grafana
    networks:
      - frontend_net
      - backend_net
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
      - shared_logs:/var/log/joomla_apache:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: parcial_nginx
    ports:
      - "80:80"
    networks:
      - frontend_net
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - joomla
      - jupyter
      - grafana
    restart: unless-stopped
