map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # 1. Enruta hacia Joomla (Portal principal)
    location / {
        proxy_pass http://joomla:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Enruta hacia Grafana (configurado con root_url /grafana/ y serve_from_sub_path)
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 3. Enruta hacia Jupyter (configurado con base_url /jupyter, WebSockets para el Kernel)
    location /jupyter/ {
        proxy_pass http://jupyter:8888;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Configuración obligatoria para el Kernel ---
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    # Atajos sin barra final y rutas absolutas de JupyterLab que llegan sin prefijo
    location = /jupyter { return 301 /jupyter/; }
    location = /grafana { return 301 /grafana/; }
    location = /lab     { return 301 /jupyter/lab; }
    location = /tree    { return 301 /jupyter/tree; }
}